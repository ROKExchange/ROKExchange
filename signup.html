<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stay Updated | ROK Exchange</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <main class="signup-page">

        <div class="signup-container">

            <img
                src="assets/images/LOGO.png"
                alt="ROK Exchange Logo"
                class="signup-logo"
            >

            <h1>Stay Updated</h1>

            <p class="signup-description">
                Enter your email to receive updates about ROK Exchange.
            </p>

            <form id="email-form">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <button type="submit">
                    Join the List
                </button>

            </form>

            <p class="privacy-notice">
                By signing up, you agree to receive updates from ROK Exchange.
                Read our
                <a href="privacy.html">Privacy Policy</a>.
            </p>

            <p id="form-message"></p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/signup.js"></script>

</body>

</html>

</html>
